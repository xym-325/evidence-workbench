name: Windows desktop build
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Fetch and verify the pinned MeSH resource
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_mesh.py --repo "${{ github.repository }}" --authenticated
      - name: Test and build
        run: python scripts/build_windows.py
      - name: Check the frozen backend
        shell: pwsh
        run: |
          $env:EVIDENCE_WORKBENCH_DATA_DIR = Join-Path $env:RUNNER_TEMP 'evidence-selftest'
          $program = Resolve-Path 'dist/EvidenceWorkbench/EvidenceWorkbench.exe'
          $report = Join-Path $env:RUNNER_TEMP 'evidence-selftest.json'
          $process = Start-Process -FilePath $program -ArgumentList @('--self-test', '--report', $report) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen self-test failed' }
          Get-Content -LiteralPath $report
      - uses: actions/upload-artifact@v4
        with:
          name: EvidenceWorkbench-windows-x64
          path: |
            dist/EvidenceWorkbench-*-windows-x64.zip
            dist/SHA256SUMS.txt
